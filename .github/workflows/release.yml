name: Release native binaries and launcher

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  license-audit:
    name: Audit dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check licenses

  validate:
    name: Validate release source (${{ matrix.os }})
    needs: license-audit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cargo test --all-targets --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --release --locked --bin codefacts
      - run: node npm/scripts/check-release-version.mjs
      - run: npm --prefix npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - run: node --test npm/test/*.test.mjs

  validate-launcher:
    name: Validate npm launcher package
    needs: license-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node npm/scripts/check-release-version.mjs
      - run: npm pack --dry-run ./npm

  build:
    name: Build (${{ matrix.name }})
    needs: [validate, validate-launcher]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            asset: codefacts-windows-x86_64.exe
            platform: win32-x64
          - name: macos-x86_64
            os: macos-15-intel
            asset: codefacts-macos-x86_64
            platform: darwin-x64
          - name: macos-aarch64
            os: macos-latest
            asset: codefacts-macos-aarch64
            platform: darwin-arm64
          - name: linux-x86_64
            os: ubuntu-latest
            asset: codefacts-linux-x86_64
            platform: linux-x64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            asset: codefacts-linux-aarch64
            platform: linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cargo build --release --locked --bin codefacts
      - run: npm --prefix npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Verify packed launcher and stdio protocol on this target
        run: node --test npm/test/*.test.mjs
      - name: Stage Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/codefacts.exe dist/${{ matrix.asset }}
      - name: Stage Unix binary
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/release/codefacts dist/${{ matrix.asset }}
          chmod +x dist/${{ matrix.asset }}
      - name: Stage and pack npm platform package
        shell: bash
        run: |
          VERSION="$(node -p "require('./npm/package.json').version")"
          BINARY="target/release/codefacts"
          if [ "${{ runner.os }}" = "Windows" ]; then BINARY="target/release/codefacts.exe"; fi
          node npm/scripts/stage-platform-package.mjs \
            --version "$VERSION" \
            --platform "${{ matrix.platform }}" \
            --binary "$BINARY" \
            --output platform-package
          mkdir -p dist/platform
          npm pack ./platform-package --pack-destination dist/platform
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-native
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-npm
          path: dist/platform/*.tgz
          if-no-files-found: error

  publish-github-release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cp LICENSE dist/LICENSE
      - name: Generate release checksums
        run: (cd dist && sha256sum codefacts-* > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/codefacts-*
            dist/LICENSE
            dist/SHA256SUMS

  publish-npm:
    name: Publish npm packages
    needs: publish-github-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Stage npm launcher package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node npm/scripts/check-release-version.mjs "$VERSION"
          node npm/scripts/stage-package.mjs \
            --version "$VERSION" \
            --output npm-dist
          mkdir -p npm-main
          npm pack ./npm-dist --pack-destination npm-main
      - name: Configure token fallback when supplied
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
      - name: Publish platform packages and main package idempotently
        shell: bash
        run: |
          MAIN_PACKAGE="$(find npm-main -type f -name '*.tgz' -print -quit)"
          if [ -z "$MAIN_PACKAGE" ]; then
            echo 'main package archive was not created' >&2
            exit 1
          fi
          node npm/scripts/publish-packages.mjs \
            --platform-dir dist \
            --main "$MAIN_PACKAGE"
